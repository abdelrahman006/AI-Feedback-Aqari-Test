<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqari — AI Chatbot Intervention Report</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 2rem 1rem; color: #1a1a1a; }
  .form-wrap { max-width: 680px; margin: 0 auto; }
  .logo-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
  .logo-icon { width: 36px; height: 36px; border-radius: 8px; background: #1B4F72; display: flex; align-items: center; justify-content: center; }
  .logo-icon i { color: #fff; font-size: 18px; }
  .logo-text { font-size: 15px; font-weight: 500; color: #1a1a1a; }
  .logo-sub { font-size: 12px; color: #666; }
  h1 { font-size: 20px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 1.5rem; }
  .top-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .section-title { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
  input[type="text"], input[type="url"], input[type="date"], textarea {
    width: 100%; font-size: 14px; padding: 8px 10px;
    border: 0.5px solid #ccc; border-radius: 8px;
    background: #f9f9f9; color: #1a1a1a; font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #1B4F72; background: #fff; }
  textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .chat-block { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .chat-block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .chat-num { font-size: 13px; font-weight: 500; color: #1a1a1a; display: flex; align-items: center; gap: 6px; }
  .chat-num i { font-size: 15px; color: #1B4F72; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #999; padding: 4px 6px; border-radius: 6px; display: flex; align-items: center; font-size: 18px; }
  .remove-btn:hover { color: #c0392b; background: #fdecea; }
  .issues-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 4px; }
  .issue-chip { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: 0.5px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 13px; color: #333; background: #f9f9f9; transition: all 0.12s; user-select: none; }
  .issue-chip:hover { border-color: #2980b9; background: #eaf4fb; color: #1B4F72; }
  .issue-chip.selected { border-color: #2980b9; background: #dbeeff; color: #1B4F72; font-weight: 500; }
  .issue-chip i { font-size: 14px; flex-shrink: 0; }
  .issue-chip.other-chip { grid-column: 1 / -1; }
  .other-input-wrap { display: none; margin-top: 8px; grid-column: 1 / -1; }
  .other-input-wrap.visible { display: block; }
  .other-hint { font-size: 12px; color: #888; margin-bottom: 5px; }
  .other-input-wrap input { font-size: 13px; padding: 7px 10px; border: 0.5px solid #2980b9; border-radius: 8px; background: #f0f8ff; }
  .other-input-wrap input:focus { outline: none; background: #fff; }
  .add-chat-btn { width: 100%; padding: 10px; border: 1px dashed #bbb; border-radius: 12px; background: transparent; cursor: pointer; font-size: 14px; color: #666; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 1rem; transition: all 0.12s; }
  .add-chat-btn:hover { background: #f0f0f0; color: #333; border-color: #999; }
  .actions { display: flex; gap: 10px; margin-top: 0.5rem; }
  .btn { flex: 1; padding: 10px 16px; border: 0.5px solid #ccc; border-radius: 8px; background: transparent; cursor: pointer; font-size: 14px; font-family: inherit; color: #333; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.12s; }
  .btn:hover { background: #f0f0f0; }
  .btn.primary { background: #1B4F72; color: #fff; border-color: #1B4F72; }
  .btn.primary:hover { background: #154060; }
  .btn.submit-btn { background: #27AE60; color: #fff; border-color: #27AE60; flex: 2; }
  .btn.submit-btn:hover { background: #1e8449; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .divider { height: 0.5px; background: #eee; margin: 14px 0; }
  .chat-link-preview { font-size: 12px; color: #2980b9; margin-top: 4px; word-break: break-all; }

  /* Success overlay */
  .success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
  .success-overlay.show { display: flex; }
  .success-box { background: #fff; border-radius: 16px; padding: 2.5rem 2rem; text-align: center; max-width: 340px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .success-icon { width: 56px; height: 56px; background: #eafaf1; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .success-icon i { font-size: 28px; color: #27AE60; }
  .success-box h2 { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .success-box p { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 1.5rem; }
  .success-box button { padding: 10px 28px; background: #1B4F72; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .success-box button:hover { background: #154060; }

  /* Spinner */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .row, .issues-grid { grid-template-columns: 1fr; }
    .issue-chip.other-chip { grid-column: 1; }
    .other-input-wrap { grid-column: 1; }
    .actions { flex-wrap: wrap; }
    body { padding: 1rem 0.75rem; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .actions, .add-chat-btn, .remove-btn, .success-overlay { display: none !important; }
    .chat-block, .top-card { border: 1px solid #ccc; break-inside: avoid; margin-bottom: 1rem; }
    .issue-chip.selected { background: #dbeeff !important; border-color: #1B4F72 !important; color: #1B4F72 !important; }
    input, textarea { border: none !important; background: transparent !important; padding: 0 !important; }
    .other-input-wrap.visible { display: block !important; }
  }
</style>
</head>
<body>

<!-- Success Overlay -->
<div class="success-overlay" id="success-overlay">
  <div class="success-box">
    <div class="success-icon"><i class="ti ti-check"></i></div>
    <h2>Report Submitted!</h2>
    <p>Your report has been saved to the Aqari AI Feedback sheet. The SoftSpace team will review it shortly.</p>
    <button onclick="resetForm()">Submit Another Report</button>
  </div>
</div>

<div class="form-wrap">
  <div class="logo-bar">
    <div class="logo-icon"><i class="ti ti-building-estate"></i></div>
    <div>
      <div class="logo-text">Aqari</div>
      <div class="logo-sub">Property Management System</div>
    </div>
  </div>

  <h1>AI Chatbot — Intervention Report</h1>
  <p class="subtitle">Log all chats that didn't go well in one report. Add as many as needed.</p>

  <div class="top-card">
    <div class="section-title">Report info</div>
    <div class="row">
      <div class="field">
        <label><i class="ti ti-user" style="font-size:13px;margin-right:4px"></i>Submitted by</label>
        <input type="text" id="agent-name" placeholder="Your name">
      </div>
      <div class="field">
        <label><i class="ti ti-calendar" style="font-size:13px;margin-right:4px"></i>Report date</label>
        <input type="date" id="report-date">
      </div>
    </div>
  </div>

  <div id="chats-container"></div>

  <button class="add-chat-btn" onclick="addChat()">
    <i class="ti ti-plus"></i> Add another chat
  </button>

  <div class="actions">
    <button class="btn" onclick="window.print()"><i class="ti ti-printer"></i>Print</button>
    <button class="btn" onclick="shareReport()"><i class="ti ti-share"></i>Share</button>
    <button class="btn submit-btn" id="submit-btn" onclick="submitReport()">
      <i class="ti ti-send"></i> Submit Report to Sheet
    </button>
  </div>
</div>

<script>
  // ─── REPLACE THIS with your deployed Apps Script URL ───────────────────────
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQmlh9ReHUIMbIOtYpaPd0Uk2FLxVkQ4R2AGrTaffPqr-HApyp2LuvFt3hmS4doum9/exec';
  // ──────────────────────────────────────────────────────────────────────────

  const ISSUES = [
    { icon: 'ti-alert-triangle',       label: 'Wrong / misleading info' },
    { icon: 'ti-message-off',          label: "Bot didn't understand user" },
    { icon: 'ti-mood-sad',             label: 'Angry / frustrated client' },
    { icon: 'ti-refresh-alert',        label: 'Bot stuck in a loop' },
    { icon: 'ti-user-plus',            label: 'Client asked for a human' },
    { icon: 'ti-credit-card',          label: 'Payment / financial query' },
    { icon: 'ti-tool',                 label: 'Maintenance emergency' },
    { icon: 'ti-file-alert',           label: 'Complaint / legal concern' },
  ];

  let chatCount = 0;
  document.getElementById('report-date').value = new Date().toISOString().split('T')[0];

  function addChat() {
    chatCount++;
    const id = chatCount;
    const container = document.getElementById('chats-container');
    const block = document.createElement('div');
    block.className = 'chat-block';
    block.id = 'chat-' + id;
    block.innerHTML = `
      <div class="chat-block-header">
        <div class="chat-num"><i class="ti ti-message-circle"></i> Chat #${id}</div>
        ${id > 1 ? `<button class="remove-btn" onclick="removeChat(${id})" title="Remove"><i class="ti ti-x"></i></button>` : ''}
      </div>
      <div class="row">
        <div class="field">
          <label>Client / user name</label>
          <input type="text" id="user-${id}" placeholder="Client name">
        </div>
        <div class="field">
          <label>Chat date</label>
          <input type="date" id="date-${id}" value="${new Date().toISOString().split('T')[0]}">
        </div>
      </div>
      <div class="field">
        <label>Chat link</label>
        <input type="url" id="link-${id}" placeholder="https://..." oninput="previewLink(${id}, this.value)">
        <div class="chat-link-preview" id="lp-${id}"></div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label>What went wrong?</label>
        <div class="issues-grid" id="issues-${id}">
          ${ISSUES.map(iss => `<div class="issue-chip" onclick="toggleIssue(this)" data-val="${iss.label}"><i class="ti ${iss.icon}"></i>${iss.label}</div>`).join('')}
          <div class="issue-chip other-chip" onclick="toggleOther(this, ${id})" data-val="other" id="other-chip-${id}">
            <i class="ti ti-dots-circle-horizontal"></i>Other — specify below
          </div>
          <div class="other-input-wrap" id="other-wrap-${id}">
            <div class="other-hint">Please describe the issue:</div>
            <input type="text" id="other-text-${id}" placeholder="e.g. Wrong language, Off-topic response, Duplicate messages...">
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label>What did the bot say that was wrong?</label>
        <textarea id="botmsg-${id}" placeholder="Paste or describe the bot's bad message..."></textarea>
      </div>
      <div class="field">
        <label>What did you do to help?</label>
        <textarea id="action-${id}" placeholder="How you intervened and resolved it..."></textarea>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Suggestion to improve the bot</label>
        <textarea id="sug-${id}" placeholder="What should we fix so this doesn't happen again?" style="min-height:58px"></textarea>
      </div>
    `;
    container.appendChild(block);
    block.scrollIntoView({ behavior: 'smooth', block: 'start' });
    updateNumbers();
  }

  function toggleOther(el, id) {
    el.classList.toggle('selected');
    const wrap = document.getElementById('other-wrap-' + id);
    if (el.classList.contains('selected')) {
      wrap.classList.add('visible');
      document.getElementById('other-text-' + id).focus();
    } else {
      wrap.classList.remove('visible');
      document.getElementById('other-text-' + id).value = '';
    }
  }

  function removeChat(id) {
    const el = document.getElementById('chat-' + id);
    if (el) el.remove();
    updateNumbers();
  }

  function updateNumbers() {
    document.querySelectorAll('.chat-block').forEach((b, i) => {
      const numEl = b.querySelector('.chat-num');
      if (numEl) numEl.innerHTML = `<i class="ti ti-message-circle"></i> Chat #${i + 1}`;
    });
  }

  function toggleIssue(el) { el.classList.toggle('selected'); }

  function previewLink(id, val) {
    const p = document.getElementById('lp-' + id);
    if (p) p.textContent = val && val.startsWith('http') ? val : '';
  }

  function getAllChats() {
    return [...document.querySelectorAll('.chat-block')].map((b, i) => {
      const id = b.id.replace('chat-', '');
      const selectedIssues = [...b.querySelectorAll('.issue-chip.selected')]
        .filter(e => e.dataset.val !== 'other')
        .map(e => e.dataset.val);
      const otherChip = document.getElementById('other-chip-' + id);
      if (otherChip && otherChip.classList.contains('selected')) {
        const otherText = document.getElementById('other-text-' + id)?.value?.trim();
        selectedIssues.push(otherText ? 'Other: ' + otherText : 'Other');
      }
      return {
        num: i + 1,
        user:   document.getElementById('user-'   + id)?.value || '',
        date:   document.getElementById('date-'   + id)?.value || '',
        link:   document.getElementById('link-'   + id)?.value || '',
        issues: selectedIssues,
        botmsg: document.getElementById('botmsg-' + id)?.value || '',
        action: document.getElementById('action-' + id)?.value || '',
        sug:    document.getElementById('sug-'    + id)?.value || '',
      };
    });
  }

  // ─── Submit to Google Sheet ────────────────────────────────────────────────
  async function submitReport() {
    const agent = document.getElementById('agent-name').value.trim();
    const rdate = document.getElementById('report-date').value;
    if (!agent) { alert('Please enter your name before submitting.'); return; }

    const chats = getAllChats();
    if (chats.length === 0) { alert('Please add at least one chat.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Submitting...';

    try {
      const params = new URLSearchParams({
        agent,
        reportDate: rdate,
        submittedAt: new Date().toISOString(),
        chats: encodeURIComponent(JSON.stringify(chats)),
      });
      const url = APPS_SCRIPT_URL + '?' + params.toString();

      const res = await fetch(url, { method: 'GET', mode: 'no-cors' });
      // no-cors means we won't get a readable response, but the request goes through
      document.getElementById('success-overlay').classList.add('show');
    } catch (err) {
      alert('Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-send"></i> Submit Report to Sheet';
    }
  }

  function resetForm() {
    document.getElementById('success-overlay').classList.remove('show');
    document.getElementById('chats-container').innerHTML = '';
    document.getElementById('agent-name').value = '';
    document.getElementById('report-date').value = new Date().toISOString().split('T')[0];
    chatCount = 0;
    addChat();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─── Share / Copy ──────────────────────────────────────────────────────────
  function buildReport() {
    const agent = document.getElementById('agent-name').value || '—';
    const rdate = document.getElementById('report-date').value || '—';
    const chats = getAllChats();
    const lines = [
      '🏠 AQARI — AI Chatbot Intervention Report',
      '═'.repeat(44),
      `Submitted by: ${agent}`,
      `Report date:  ${rdate}`,
      `Total chats:  ${chats.length}`,
      '',
    ];
    chats.forEach(c => {
      lines.push('─'.repeat(44));
      lines.push(`Chat #${c.num} — ${c.user || '—'}  |  ${c.date || '—'}`);
      lines.push(`Link: ${c.link || '—'}`);
      lines.push(`Issues: ${c.issues.length ? c.issues.join(', ') : '—'}`);
      lines.push(`\nWhat the bot did wrong:\n${c.botmsg || '—'}`);
      lines.push(`\nHow I intervened:\n${c.action || '—'}`);
      lines.push(`\nSuggestion:\n${c.sug || '—'}`);
      lines.push('');
    });
    return lines.join('\n');
  }

  function shareReport() {
    const text = buildReport();
    if (navigator.share) {
      navigator.share({ title: 'Aqari Chatbot Intervention Report', text });
    } else {
      window.open('mailto:?subject=Aqari%20Chatbot%20Intervention%20Report&body=' + encodeURIComponent(text));
    }
  }

  addChat();
</script>
</body>
</html>
